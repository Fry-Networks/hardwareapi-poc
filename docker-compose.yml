services:
  hardware_exe_api:
    restart: unless-stopped
    build:
      context: .
    ports:
      - "8084:8084"
    dns:
      - 100.100.100.100
      - 8.8.8.8
    environment:
      PORT: "8084"
      HOST: "0.0.0.0"
      UVICORN_RELOAD: "false"
      TRUSTED_PROXY_IPS: "172.17.0.1,127.0.0.1,::1,100.96.170.14"
      WHITELIST_IPS: "38.142.94.218,23.87.33.15,100.96.170.14"
      MONGO_CA_CERT_PATH: "/etc/ssl/mongo/mongo-ca.crt"
      MONGODB_URI: "${MONGODB_URI:-op://HardwareAPI/Secrets/MONGO_URI}"
      API_BEARER_TOKEN: "${API_BEARER_TOKEN:-op://HardwareAPI/Secrets/API_BEARER_TOKEN}"
      API_BEARER_TOKEN_FLXTIME: "${API_BEARER_TOKEN_FLXTIME:-op://HardwareAPI/Secrets/API_BEARER_TOKEN_FLXTIME}"
      API_BEARER_TOKEN_ADMIN: "${API_BEARER_TOKEN_ADMIN:-op://HardwareAPI/Secrets/API_BEARER_TOKEN_ADMIN}"
      API_BEARER_TOKEN_DROPWIRELESS: "${API_BEARER_TOKEN_DROPWIRELESS:-op://HardwareAPI/Secrets/API_BEARER_TOKEN_DROPWIRELESS}"
      DIIISCO_ENCRYPTION_KEY: "${DIIISCO_ENCRYPTION_KEY:-op://HardwareAPI/Secrets/DIIISCO_ENCRYPTION_KEY}"
      MYST_REG_TOKEN: "${MYST_REG_TOKEN:-op://HardwareAPI/Secrets/MYST_REG_TOKEN}"
      # Probe detection thresholds (exempt paths handled in app.py)
      PROBE_404_WINDOW: "60"
      PROBE_404_THRESHOLD: "20"
      PROBE_BLOCK_SECONDS: "3600"
      PROBE_404_CONSEC_THRESHOLD: "12"
      SENSITIVE_WINDOW: "30"
      SENSITIVE_THRESHOLD: "3"
      POC_LIVENESS_CUTOFF_DATE: "2026-04-20T00:00:00Z"
      POC_LIVENESS_STALENESS_SECONDS: "86400"
      FLXTIME_RATE_LIMIT: "100/minute"
    secrets:
      - op_service_account_token
    volumes:
      - ./logs:/app/logs
      - /etc/ssl/mongo/mongo-ca.crt:/etc/ssl/mongo/mongo-ca.crt:ro

secrets:
  op_service_account_token:
    file: /etc/opt/hardwareapi/op_service_account_token
